<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  a { color: #ffffff; text-decoration: none; }
  a:hover { color: #f7d92b; }
  @keyframes twinkle { 0%, 100% { opacity: .35 } 50% { opacity: .9 } }
  @media (max-width: 980px) {
    [data-hide-mobile] { display: none !important; }
    [data-show-mobile] { display: flex !important; }
  }
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: #000000; font-family: 'Chakra Petch', system-ui, sans-serif; color: #fff; overflow-x: hidden;">

  <sc-if value="{{ showStarfield }}" hint-placeholder-val="{{ true }}">
    <div style="position: fixed; inset: 0; pointer-events: none; background-color: #000; background-image: radial-gradient(1.2px 1.2px at 14px 22px, rgba(255,255,255,.85), transparent), radial-gradient(1px 1px at 96px 58px, rgba(255,255,255,.55), transparent), radial-gradient(1.6px 1.6px at 160px 130px, rgba(255,255,255,.7), transparent), radial-gradient(1px 1px at 232px 40px, rgba(255,255,255,.4), transparent), radial-gradient(1.1px 1.1px at 60px 190px, rgba(255,255,255,.6), transparent), radial-gradient(1px 1px at 300px 210px, rgba(255,255,255,.35), transparent); background-size: 340px 260px; opacity: .8;"></div>
    <div style="position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(2px 2px at 40px 80px, rgba(255,255,255,.75), transparent), radial-gradient(1.6px 1.6px at 420px 300px, rgba(255,255,255,.9), transparent); background-size: 620px 440px; animation: twinkle 5.5s ease-in-out infinite;"></div>
  </sc-if>
  <div style="position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 70% at 50% -10%, rgba(247,217,43,.06), transparent 60%);"></div>

  <header style="position: relative; z-index: 10; border-bottom: 1px solid #1a1a1a; background: linear-gradient(#000000, rgba(0,0,0,.82)); backdrop-filter: blur(2px);">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 28px; border-bottom: 1px solid #111111;">
      <nav data-hide-mobile style="display: flex; align-items: center; gap: 18px; flex: 1 1 0; min-width: 0;">
        <sc-for list="{{ resources }}" as="res" hint-placeholder-count="6">
          <a href="#" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #8b9098; white-space: nowrap; transition: color .18s, text-shadow .18s;" style-hover="color: #f7d92b; text-shadow: 0 0 12px rgba(247,217,43,.65)">{{ res }}</a>
        </sc-for>
      </nav>

      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 0 0 auto; transition: text-shadow .2s;" style-hover="text-shadow: 0 0 18px rgba(247,217,43,.6)">
        <span style="font-size: 30px; font-weight: 700; letter-spacing: .34em; text-transform: uppercase; line-height: 1; color: {{ accent }};">{{ wordmark }}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .38em; text-transform: uppercase; color: #6f747c;">{{ tagline }}</span>
      </a>

      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 16px; flex: 1 1 0;">
        <div style="display: flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid #262626; background: #0c0c0c; transition: border-color .2s, box-shadow .2s;" style-hover="border-color: #f7d92b; box-shadow: 0 0 16px rgba(247,217,43,.18)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8ccd2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
          <input value="{{ query }}" onChange="{{ onQuery }}" placeholder="SEARCH" style="width: {{ searchWidth }}; border: 0; outline: 0; background: transparent; color: #ffffff; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; transition: width .25s;" />
        </div>
        <a href="#" data-hide-mobile style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #ffffff; white-space: nowrap; transition: color .18s, text-shadow .18s;" style-hover="color: #f7d92b; text-shadow: 0 0 12px rgba(247,217,43,.6)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"></path></svg>
          LOG IN
        </a>
        <button data-show-mobile onClick="{{ toggleMenu }}" style="display: none; align-items: center; justify-content: center; width: 36px; height: 32px; border: 1px solid #262626; background: #0c0c0c; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" stroke="#f7d92b" stroke-width="2" stroke-linecap="round"><line x1="3" y1="7" x2="21" y2="7"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="17" x2="21" y2="17"></line></svg>
        </button>
      </div>
    </div>

    <nav data-hide-mobile style="display: flex; align-items: stretch; justify-content: center; gap: 40px; padding: 0 28px;">
      <sc-for list="{{ sections }}" as="item" hint-placeholder-count="6">
        <a href="#" onClick="{{ item.select }}" style="position: relative; display: flex; align-items: center; padding: 16px 2px 15px; font-size: 13px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; color: {{ item.color }}; text-shadow: {{ item.shadow }}; transition: color .18s, text-shadow .18s;" style-hover="color: #ffffff; text-shadow: 0 0 14px rgba(247,217,43,.5)">
          {{ item.label }}
          <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: {{ item.bar }}; box-shadow: {{ item.barGlow }};"></span>
        </a>
      </sc-for>
    </nav>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <nav style="display: flex; flex-direction: column; border-top: 1px solid #1a1a1a; background: #050505;">
        <sc-for list="{{ mobileItems }}" as="m" hint-placeholder-count="6">
          <a href="#" style="padding: 14px 28px; border-bottom: 1px solid #111111; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #cfd3d8;" style-hover="color: #f7d92b">{{ m }}</a>
        </sc-for>
      </nav>
    </sc-if>
  </header>

  <div style="position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 20px; background: #0a0a0a; border-bottom: 1px solid #161616;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #7d818a;">{{ bannerText }}</span>
    <span style="font-size: 10px; color: {{ accent }};">▸</span>
  </div>

  <main style="position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 96px 28px 120px; text-align: center;">
    <p style="margin: 0 0 18px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .42em; text-transform: uppercase; color: #6f747c;">CURRENT SECTION</p>
    <h1 style="margin: 0; font-size: 58px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; line-height: 1.06; color: #ffffff;">{{ activeLabel }}</h1>
    <div style="width: 96px; height: 4px; margin: 28px auto 0; background: {{ accent }};"></div>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f7d92b&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#f7d92b&quot;,&quot;#4fd1ff&quot;,&quot;#ff5a5a&quot;,&quot;#8ef58a&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;showStarfield&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;activeSection&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;DATABANK&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;NEWS + FEATURES&quot;,&quot;FILMS&quot;,&quot;SERIES&quot;,&quot;DATABANK&quot;,&quot;PLANETS&quot;,&quot;VEHICLES&quot;],&quot;section&quot;:&quot;Navigation&quot;},&quot;wordmark&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SWAPI&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;GALACTIC DATABASE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;bannerText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;STAR WARS ON SWAPI DATABASE&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { query: "", focused: false, menuOpen: false, active: null };

  renderVals() {
    const accent = this.props.accentColor ?? "#f7d92b";
    const sectionNames = ["NEWS + FEATURES", "FILMS", "SERIES", "DATABANK", "PLANETS", "VEHICLES"];
    const active = this.state.active ?? (this.props.activeSection ?? "DATABANK");
    const resources = ["PEOPLE", "FILMS", "STARSHIPS", "VEHICLES", "SPECIES", "PLANETS"];

    return {
      accent,
      showStarfield: this.props.showStarfield ?? true,
      wordmark: this.props.wordmark ?? "SWAPI",
      tagline: this.props.tagline ?? "GALACTIC DATABASE",
      bannerText: this.props.bannerText ?? "STAR WARS ON SWAPI DATABASE",
      resources,
      mobileItems: sectionNames.concat(resources),
      menuOpen: this.state.menuOpen,
      query: this.state.query,
      searchWidth: this.state.focused || this.state.query ? "180px" : "84px",
      onQuery: (e) => this.setState({ query: e.target.value.toUpperCase(), focused: true }),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      activeLabel: active,
      sections: sectionNames.map(label => {
        const on = label === active;
        return {
          label,
          color: on ? "#ffffff" : "#9a9ea6",
          shadow: on ? "0 0 16px rgba(247,217,43,.35)" : "none",
          bar: on ? accent : "transparent",
          barGlow: on ? "0 0 14px " + accent : "none",
          select: (e) => { e.preventDefault(); this.setState({ active: label }); }
        };
      })
    };
  }
}

</script>
</body>
</html>
